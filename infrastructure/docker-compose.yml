name: eona-empire

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-eona_empire}
      POSTGRES_USER: ${POSTGRES_USER:-eona}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eona_secret}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

  backend:
    build:
      context: ../backend
      dockerfile: ../infrastructure/backend/Dockerfile
    environment:
      APP_NAME: Eona Empire API
      APP_ENV: local
      APP_KEY: ${APP_KEY:-base64:qpqmhJtKSm3dAVtxsfXJoq6MkSB7dcJMgNA0G0VfjFc=}
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      FRONTEND_URL: http://localhost:3000,http://localhost:8080,http://127.0.0.1:3000,http://127.0.0.1:8080
      LOG_CHANNEL: stderr
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-eona_empire}
      DB_USERNAME: ${POSTGRES_USER:-eona}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-eona_secret}
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      REDIS_CLIENT: predis
      REDIS_HOST: redis
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_FROM_ADDRESS: hello@eonaempire.local
      PAYMENT_GATEWAY: ${PAYMENT_GATEWAY:-local_gateway}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
    ports:
      - "8000:8000"
    volumes:
      - ../backend:/var/www/html
    command: >
      sh -lc "composer install --no-interaction --prefer-dist
      && php artisan migrate --force
      && php artisan db:seed --force
      && php artisan serve --host=0.0.0.0 --port=8000"

  frontend:
    build:
      context: ../frontend
      dockerfile: ../infrastructure/frontend/Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    depends_on:
      - backend
    ports:
      - "3000:3000"
    volumes:
      - ../frontend:/app
      - frontend_node_modules:/app/node_modules
    command: sh -lc "npm install && npm run dev -- --hostname 0.0.0.0 --port 3000"

  nginx:
    image: nginx:1.29-alpine
    depends_on:
      - frontend
      - backend
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  postgres_data:
  redis_data:
  frontend_node_modules:
